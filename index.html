<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#6c5ce7">

    <meta name="description"
          content="Notes App - Aplikasi catatan sederhana dan modern">

    <title>My Notes</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="container">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">

                <div class="logo">
                    📝
                </div>

                <div>
                    <p class="subtitle">PERSONAL NOTES</p>
                    <h1>My Notes</h1>
                </div>

            </div>

            <div class="note-counter">
                <span id="jumlahCatatan">0</span>
                <small>Catatan</small>
            </div>

        </header>


        <!-- FORM -->
        <section class="form-card">

            <div class="form-header">
                <div>
                    <h2>Buat Catatan Baru</h2>
                    <p>Simpan ide, tugas, atau hal pentingmu.</p>
                </div>

                <span class="form-icon">✏️</span>
            </div>

            <form id="formCatatan">

                <div class="input-group">

                    <label for="judul">
                        Judul Catatan
                    </label>

                    <input
                        type="text"
                        id="judul"
                        placeholder="Contoh: gustiii"
                        maxlength="60"
                        autocomplete="off"
                    >

                </div>


                <div class="input-group">

                    <label for="isi">
                        Isi Catatan
                    </label>

                    <textarea
                        id="isi"
                        placeholder="Tulis catatanmu di sini..."
                        rows="5"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="save-button"
                >
                    <span>＋</span>
                    Simpan Catatan
                </button>

            </form>

        </section>


        <!-- LIST HEADER -->
        <section class="list-section">

            <div class="section-header">

                <div>
                    <p class="section-label">KOLEKSI</p>
                    <h2>Catatan Saya</h2>
                </div>

                <button
                    id="hapusSemua"
                    class="clear-button"
                    type="button"
                >
                    🗑️ Hapus Semua
                </button>

            </div>


            <!-- EMPTY STATE -->
            <div
                id="emptyState"
                class="empty-state"
            >
                <div class="empty-icon">
                    📭
                </div>

                <h3>Belum ada catatan</h3>

                <p>
                    Catatan yang kamu simpan akan muncul di sini.
                </p>
            </div>


            <!-- NOTES -->
            <div
                id="daftarCatatan"
                class="notes-grid"
            ></div>

        </section>


        <!-- FOOTER -->
        <footer>
            <p>
                🟣 My Notes PWA
                <span>•</span>
                Bisa digunakan secara offline
            </p>
        </footer>

    </main>


    <script src="app.js"></script>

</body>
</html>
